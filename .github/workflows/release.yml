name: Build Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build portable Windows app
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name KeyPulse main.py
      - name: Include privacy and license documentation
        shell: pwsh
        run: Copy-Item LICENSE, PRIVACY.md, THIRD_PARTY_NOTICES.md -Destination dist/KeyPulse/
      - name: Zip portable Windows app
        shell: pwsh
        run: Compress-Archive -Path dist/KeyPulse -DestinationPath dist/KeyPulse-Windows-x64-portable.zip
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { throw "NSIS not found at $nsis" }
          & $nsis packaging\keypulse.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed" }
      - name: Publish installers to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          files: |
            dist/KeyPulseSetup.exe
            dist/KeyPulse-Windows-x64-portable.zip
